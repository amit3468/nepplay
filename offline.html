<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Offline — NEPPLAY</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    background: #0a0618;
    color: #f5f3ff;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    padding: 20px;
  }
  .box { max-width: 360px; }
  .icon { font-size: 60px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { color: #a8a3c9; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
  button {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    color: #fff;
    border: 0;
    padding: 12px 28px;
    border-radius: 10px;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="box">
  <div class="icon">📡</div>
  <h1>You're offline</h1>
  <p>Check your internet connection and try again. NEPPLAY needs internet to load tournaments and your dashboard.</p>
  <button onclick="window.location.reload()">Try Again</button>
</div>
</body>
</html>
