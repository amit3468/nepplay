<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEPPLAY - Hall of Champions</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #080b12;
    color: white;
    min-height: 100vh;
}

header {
    background: #0d111b;
    border-bottom: 1px solid #202634;
    padding: 18px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
}
.logo { font-size: 27px; font-weight: 800; letter-spacing: 1px; }
.logo span { color: #ff3b30; }
nav { display: flex; align-items: center; gap: 28px; }
nav a {
    color: #c7ccd7; text-decoration: none;
    font-size: 15px; font-weight: 600;
}
nav a:hover, nav a.active { color: #ff4438; }
.login-btn {
    background: #ff3b30; color: white !important;
    padding: 10px 20px; border-radius: 7px;
}

.hero { text-align: center; padding: 60px 20px 30px; }
.hero h1 { font-size: 46px; margin-bottom: 15px; }
.hero h1 span { color: #ff3b30; }
.hero p { color: #9299a8; font-size: 17px; }

.stats-bar {
    width: 88%; max-width: 1100px; margin: 30px auto 0;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
}
.stat-box {
    background: #111621; border: 1px solid #242b39;
    border-radius: 12px; padding: 20px; text-align: center;
}
.stat-number {
    font-size: 28px; font-weight: bold;
    color: #ffd43b; margin-bottom: 6px;
}
.stat-label { color: #9299a8; font-size: 13px; }

.controls {
    width: 88%; max-width: 1100px; margin: 40px auto 20px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 15px; flex-wrap: wrap;
}
.game-tabs { display: flex; gap: 10px; flex-wrap: wrap; }
.game-tab {
    padding: 10px 18px; background: #111621;
    border: 1px solid #293141; border-radius: 7px;
    color: #c5cbd6; cursor: pointer; font-weight: 600; font-size: 14px;
}
.game-tab.active, .game-tab:hover {
    background: #ff3b30; border-color: #ff3b30; color: white;
}
.search-input {
    background: #111621; border: 1px solid #293141;
    border-radius: 7px; padding: 10px 15px;
    color: white; outline: none; min-width: 240px; font-size: 14px;
}
.search-input:focus { border-color: #ff3b30; }

.container { width: 88%; max-width: 1100px; margin: auto; padding-bottom: 70px; }
.champions-list { display: grid; gap: 20px; }

.champion-card {
    background: linear-gradient(135deg, #1a1608 0%, #111621 100%);
    border: 2px solid #ffd43b;
    border-radius: 14px;
    padding: 24px;
    position: relative;
    overflow: hidden;
}

.champion-card::before {
    content: "CHAMPION";
    position: absolute;
    top: 14px; right: -32px;
    background: #ffd43b;
    color: #0d111b;
    font-weight: 900;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 6px 40px;
    transform: rotate(45deg);
    transform-origin: center;
}

.champion-header {
    display: flex; align-items: flex-start;
    gap: 18px; margin-bottom: 18px; flex-wrap: wrap;
}

.trophy-icon {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffd43b, #ffb800);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900; color: #0d111b;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(255, 212, 59, 0.4);
}

.tournament-info { flex: 1; min-width: 200px; }
.tournament-name {
    font-size: 20px; font-weight: bold; margin-bottom: 6px;
    color: white;
}
.tournament-meta { color: #9299a8; font-size: 13px; line-height: 1.6; }
.tournament-meta span { margin-right: 14px; display: inline-block; }

.final-display {
    background: #0b1220;
    border: 1px solid #2d3a55;
    border-radius: 12px;
    padding: 18px;
    margin: 18px 0;
    display: grid;
    grid-template-columns: 1fr 60px 1fr;
    align-items: center;
    gap: 15px;
}

.final-team {
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    background: #111621;
    border: 1px solid #273244;
}

.final-team.champion {
    background: linear-gradient(135deg, #2a2208, #111621);
    border-color: #ffd43b;
}

.final-team-name {
    font-size: 16px; font-weight: bold; margin-bottom: 5px;
    word-break: break-word;
}
.final-team.champion .final-team-name { color: #ffd43b; }
.final-team-captain { font-size: 12px; margin-bottom: 8px; }
.final-team-captain a {
    color: #9299a8; text-decoration: none;
}
.final-team-captain a:hover { color: #ff4438; text-decoration: underline; }
.final-team.champion .final-team-captain a { color: #ffd43b; }
.final-team-score {
    font-size: 26px; font-weight: bold; color: #ff4438;
}
.final-team.champion .final-team-score { color: #ffd43b; }

.final-vs { text-align: center; color: #64748b; font-weight: bold; font-size: 14px; }

.champion-badge {
    display: inline-block;
    background: #ffd43b;
    color: #0d111b;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-top: 6px;
}

.champion-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    padding-top: 14px;
    border-top: 1px solid #2d3a55;
}

.prize-info {
    color: #ffd43b;
    font-size: 14px;
    font-weight: bold;
}

.winner-name-large {
    font-size: 22px;
    color: #ffd43b;
    font-weight: 900;
    letter-spacing: 1px;
}

.empty, .loading {
    text-align: center; padding: 60px 20px;
    color: #8993a2; font-size: 14px; line-height: 1.7;
    background: #111621; border: 1px solid #242b39;
    border-radius: 12px;
}
.loading-spinner {
    display: inline-block;
    width: 30px; height: 30px;
    border: 3px solid #242b39;
    border-top-color: #ff3b30;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 15px;
}
@keyframes spin { to { transform: rotate(360deg); } }

footer {
    border-top: 1px solid #202634;
    text-align: center; padding: 25px;
    color: #717887; font-size: 13px;
}

@media (max-width: 900px) {
    .stats-bar { grid-template-columns: 1fr; }
    .final-display { grid-template-columns: 1fr; }
    .final-vs { padding: 6px 0; }
}
@media (max-width: 750px) {
    header { flex-direction: column; gap: 15px; }
    nav { flex-wrap: wrap; justify-content: center; gap: 14px; }
    .hero h1 { font-size: 34px; }
    .controls { flex-direction: column; align-items: stretch; }
    .search-input { width: 100%; }
}
</style>
</head>

<body>

<header>
    <div class="logo">NEP<span>PLAY</span></div>
    <nav>
        <a href="index.html">Home</a>
        <a href="tournaments.html">Tournaments</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="teams.html">Teams</a>
        <a href="winners.html" class="active">Winners</a>
        <a href="login.html" class="login-btn">Login</a>
    </nav>
</header>

<section class="hero">
    <h1>Hall of <span>Champions</span></h1>
    <p>Every NEPPLAY tournament winner. Every legend. Every victory.</p>
</section>

<div class="stats-bar">
    <div class="stat-box">
        <div class="stat-number" id="totalTournaments">0</div>
        <div class="stat-label">Tournaments Completed</div>
    </div>
    <div class="stat-box">
        <div class="stat-number" id="totalChampions">0</div>
        <div class="stat-label">Champions Crowned</div>
    </div>
    <div class="stat-box">
        <div class="stat-number" id="totalPrize">Rs. 0</div>
        <div class="stat-label">Total Prize Money</div>
    </div>
</div>

<div class="controls">
    <div class="game-tabs">
        <button class="game-tab active" data-game="all" onclick="changeGame('all', this)">All Games</button>
        <button class="game-tab" data-game="Free Fire" onclick="changeGame('Free Fire', this)">Free Fire</button>
        <button class="game-tab" data-game="PUBG Mobile" onclick="changeGame('PUBG Mobile', this)">PUBG Mobile</button>
        <button class="game-tab" data-game="Mobile Legends" onclick="changeGame('Mobile Legends', this)">Mobile Legends</button>
        <button class="game-tab" data-game="eFootball" onclick="changeGame('eFootball', this)">eFootball</button>
    </div>
    <input type="text" class="search-input" id="searchBox" placeholder="Search champion or tournament..." oninput="renderChampions()">
</div>

<main class="container">
    <div class="champions-list" id="championsList">
        <div class="loading">
            <div class="loading-spinner"></div>
            <div>Loading champions...</div>
        </div>
    </div>
</main>

<footer>
    © 2026 NEPPLAY — Nepal Gaming Community
</footer>

<script>

var allWinners = [];
var currentGame = "all";

function esc(v) {
    if (v === undefined || v === null) return "";
    return String(v)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatDate(value) {
    if (!value) return "Date TBA";
    var d = new Date(value + "T00:00:00");
    if (isNaN(d.getTime())) return value;
    return d.toLocaleDateString("en-NP", {
        year: "numeric", month: "short", day: "numeric"
    });
}

function loadWinners() {
    fetch("/api/winners", { cache: "no-store" })
    .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
    })
    .then(function (data) {
        var list = [];
        if (Array.isArray(data)) list = data;
        else if (data && Array.isArray(data.winners)) list = data.winners;

        allWinners = list;
        updateStats();
        renderChampions();
    })
    .catch(function (err) {
        document.getElementById("championsList").innerHTML =
            '<div class="empty">Could not load champions.<br>Make sure the server is running.</div>';
        console.error(err);
    });
}

function updateStats() {
    var total = allWinners.length;

    var seen = {};
    var unique = 0;
    var prizeSum = 0;

    for (var i = 0; i < allWinners.length; i++) {
        var w = allWinners[i];
        var key = String(w.champion || "").toLowerCase();
        if (key && !seen[key]) {
            seen[key] = true;
            unique++;
        }
        prizeSum += Number(w.prizePool) || 0;
    }

    document.getElementById("totalTournaments").textContent = total;
    document.getElementById("totalChampions").textContent = unique;
    document.getElementById("totalPrize").textContent =
        "Rs. " + prizeSum.toLocaleString("en-NP");
}

function getFiltered() {
    var list = allWinners.slice();

    if (currentGame !== "all") {
        list = list.filter(function (w) {
            return String(w.game || "").toLowerCase() === currentGame.toLowerCase();
        });
    }

    var search = (document.getElementById("searchBox").value || "")
        .toLowerCase().trim();

    if (search) {
        list = list.filter(function (w) {
            var text = (
                (w.champion || "") + " " +
                (w.runnerUp || "") + " " +
                (w.tournamentName || "") + " " +
                (w.game || "")
            ).toLowerCase();
            return text.indexOf(search) !== -1;
        });
    }

    return list;
}

function renderChampions() {
    var container = document.getElementById("championsList");
    var list = getFiltered();

    if (list.length === 0) {
        container.innerHTML =
            '<div class="empty">' +
                '<strong>No champions yet.</strong><br>' +
                'Complete a tournament and mark the final match to see winners here.' +
            '</div>';
        return;
    }

    var html = "";
    for (var i = 0; i < list.length; i++) {
        html += renderCard(list[i]);
    }
    container.innerHTML = html;
}

function renderCard(w) {
    var prize = (w.prizePool || 0) > 0
        ? '<div class="prize-info">Prize Pool: Rs. ' +
            Number(w.prizePool).toLocaleString("en-NP") +
          '</div>'
        : '<div class="prize-info">No prize pool</div>';

    /* Champion captain link */
    var champCaptainHtml = "";
    if (w.championCaptain) {
        champCaptainHtml = 'Captain: <a href="player.html?username=' +
            encodeURIComponent(w.championCaptain) + '">' +
            esc(w.championCaptain) + '</a>';
    } else {
        champCaptainHtml = "&nbsp;";
    }

    /* Runner-up captain link */
    var runCaptainHtml = "";
    if (w.runnerUpCaptain) {
        runCaptainHtml = 'Captain: <a href="player.html?username=' +
            encodeURIComponent(w.runnerUpCaptain) + '">' +
            esc(w.runnerUpCaptain) + '</a>';
    } else {
        runCaptainHtml = "&nbsp;";
    }

    return (
        '<div class="champion-card">' +

            '<div class="champion-header">' +
                '<div class="trophy-icon">1</div>' +
                '<div class="tournament-info">' +
                    '<div class="tournament-name">' +
                        esc(w.tournamentName || "Tournament") +
                    '</div>' +
                    '<div class="tournament-meta">' +
                        '<span>Game: ' + esc(w.game || "-") + '</span>' +
                        '<span>Date: ' + esc(formatDate(w.date)) + '</span>' +
                        '<span>Matches: ' + (w.totalMatches || 0) + '</span>' +
                    '</div>' +
                '</div>' +
            '</div>' +

            '<div class="final-display">' +

                '<div class="final-team champion">' +
                    '<div class="final-team-name">' +
                        esc(w.champion || "Champion") +
                    '</div>' +
                    '<div class="final-team-captain">' +
                        champCaptainHtml +
                    '</div>' +
                    '<div class="final-team-score">' +
                        esc(w.championScore || "0") +
                    '</div>' +
                    '<span class="champion-badge">WINNER</span>' +
                '</div>' +

                '<div class="final-vs">VS</div>' +

                '<div class="final-team">' +
                    '<div class="final-team-name">' +
                        esc(w.runnerUp || "Runner-up") +
                    '</div>' +
                    '<div class="final-team-captain">' +
                        runCaptainHtml +
                    '</div>' +
                    '<div class="final-team-score">' +
                        esc(w.runnerUpScore || "0") +
                    '</div>' +
                '</div>' +

            '</div>' +

            '<div class="champion-footer">' +
                prize +
                '<div class="winner-name-large">' +
                    esc(w.champion || "") +
                '</div>' +
            '</div>' +

        '</div>'
    );
}

function changeGame(game, button) {
    currentGame = game;
    var tabs = document.querySelectorAll(".game-tab");
    for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.remove("active");
    }
    button.classList.add("active");
    renderChampions();
}

loadWinners();

</script>

</body>
</html>
