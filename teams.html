<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams - Nepal Gaming Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .team-card { transition: transform 0.2s, box-shadow 0.2s; }
        .team-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3); }
        .tab-btn.active { background-color: #3b82f6; color: white; border-color: #3b82f6; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); }
        .role-captain { background-color: rgba(251, 191, 36, 0.2); color: #fbbf24; border: 1px solid #fbbf24; }
        .role-member { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #60a5fa; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="glass-panel w-full p-4 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-gamepad text-blue-500 text-2xl"></i>
            <span class="text-xl font-bold text-white">Nepal Gaming</span>
        </div>
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-sm text-gray-300 hover:text-white transition">Home</a>
            <a href="tournaments.html" class="text-sm text-gray-300 hover:text-white transition">Tournaments</a>
            <a href="winners.html" class="text-sm text-gray-300 hover:text-white transition">Winners</a>
            <a href="leaderboard.html" class="text-sm text-gray-300 hover:text-white transition">Leaderboard</a>
            <a href="teams.html" class="text-sm text-blue-400 font-bold">Teams</a>
            <a href="member.html" class="text-sm bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded transition">Dashboard</a>
        </div>
    </nav>

    <main class="flex-grow container mx-auto p-6">
        
        <!-- Page Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2"><i class="fa-solid fa-users-rays text-blue-500 mr-3"></i>Teams</h1>
            <p class="text-gray-400">Create a team, invite friends, and dominate together.</p>
        </div>

        <!-- Toggle Tabs -->
        <div class="flex justify-center gap-3 mb-8">
            <button id="tabMyTeams" class="tab-btn active px-6 py-2 rounded-full border border-gray-600 text-sm font-semibold hover:border-blue-500 transition" onclick="showView('my', this)">
                <i class="fa-solid fa-user-group mr-1"></i> My Teams
            </button>
            <button id="tabBrowse" class="tab-btn px-6 py-2 rounded-full border border-gray-600 text-sm font-semibold hover:border-blue-500 transition" onclick="showView('browse', this)">
                <i class="fa-solid fa-globe mr-1"></i> Browse Teams
            </button>
            <button onclick="openCreateModal()" class="px-6 py-2 rounded-full bg-green-600 hover:bg-green-700 text-sm font-semibold text-white transition">
                <i class="fa-solid fa-plus mr-1"></i> Create Team
            </button>
        </div>

        <!-- Empty State (shows when user has no teams) -->
        <div id="empty-my-teams" class="hidden text-center py-20">
            <i class="fa-solid fa-users-slash text-6xl text-gray-600 mb-4"></i>
            <h2 class="text-xl font-bold text-white mb-2">You're not in any team yet</h2>
            <p class="text-gray-400 mb-6">Create your own team or browse existing ones to join.</p>
            <button onclick="openCreateModal()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg transition">
                <i class="fa-solid fa-plus mr-2"></i> Create My Team
            </button>
        </div>

        <!-- Teams Grid -->
        <div id="teams-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Team cards injected via JS -->
        </div>

    </main>

    <!-- Create Team Modal -->
    <div id="createModal" class="hidden fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
        <div class="glass-panel rounded-xl w-full max-w-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-plus-circle text-green-500 mr-2"></i>Create New Team</h2>
                <button onclick="closeCreateModal()" class="text-gray-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="createTeamForm" onsubmit="createTeam(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Team Name *</label>
                    <input type="text" id="teamName" class="w-full px-4 py-3 rounded-lg bg-gray-800 text-white border border-gray-600 focus:outline-none focus:border-blue-500" placeholder="e.g., Kathmandu Kings" required>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Tagline</label>
                    <input type="text" id="teamTagline" class="w-full px-4 py-3 rounded-lg bg-gray-800 text-white border border-gray-600 focus:outline-none focus:border-blue-500" placeholder="e.g., Born to win" maxlength="50">
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Game *</label>
                        <select id="teamGame" class="w-full px-4 py-3 rounded-lg bg-gray-800 text-white border border-gray-600 focus:outline-none focus:border-blue-500" required>
                            <option value="">Select</option>
                            <option value="freefire">Free Fire</option>
                            <option value="pubg">PUBG Mobile</option>
                            <option value="valorant">Valorant</option>
                            <option value="cod">COD Mobile</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Max Members *</label>
                        <input type="number" id="teamMax" class="w-full px-4 py-3 rounded-lg bg-gray-800 text-white border border-gray-600 focus:outline-none focus:border-blue-500" min="2" max="10" value="4" required>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="teamPublic" class="w-4 h-4 rounded">
                        <span class="text-sm text-gray-300">Make team public (others can request to join)</span>
                    </label>
                </div>

                <div class="flex gap-3">
                    <button type="submit" class="flex-grow bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition">
                        <i class="fa-solid fa-check mr-2"></i>Create Team
                    </button>
                    <button type="button" onclick="closeCreateModal()" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-lg transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Team Details Modal -->
    <div id="detailsModal" class="hidden fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
        <div class="glass-panel rounded-xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white" id="detailsTitle">Team Details</h2>
                <button onclick="closeDetailsModal()" class="text-gray-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="detailsContent">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="glass-panel w-full p-6 mt-8">
        <div class="container mx-auto max-w-6xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-gamepad text-blue-500 text-xl"></i>
                <span class="font-bold text-white">Nepal Gaming</span>
            </div>
            <div class="text-sm text-gray-500">&copy; 2023 Nepal Gaming. All rights reserved.</div>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        console.log("--- TEAMS PAGE LOADED ---");

        // 1. Sample Teams Data
        const allTeams = [
            {
                id: 1,
                name: "Kathmandu Kings",
                tagline: "Born to win",
                game: "pubg",
                gameName: "PUBG Mobile",
                icon: "fa-crosshairs",
                color: "from-yellow-500 to-orange-600",
                isPublic: true,
                maxMembers: 4,
                earnings: 45000,
                wins: 12,
                createdBy: "rahul_sharma",
                members: [
                    { name: "Rahul Sharma", role: "Captain", isCurrentUser: false },
                    { name: "Sujal Thapa", role: "Member", isCurrentUser: false },
                    { name: "Bibek Gurung", role: "Member", isCurrentUser: false }
                ]
            },
            {
                id: 2,
                name: "Pokhara Warriors",
                tagline: "Fear the warriors",
                game: "freefire",
                gameName: "Free Fire",
                icon: "fa-fire",
                color: "from-orange-500 to-red-600",
                isPublic: true,
                maxMembers: 4,
                earnings: 32000,
                wins: 9,
                createdBy: "sujal_thapa",
                members: [
                    { name: "Sujal Thapa", role: "Captain", isCurrentUser: false },
                    { name: "Anish Rai", role: "Member", isCurrentUser: false }
                ]
            },
            {
                id: 3,
                name: "Everest Esports",
                tagline: "Reach the peak",
                game: "valorant",
                gameName: "Valorant",
                icon: "fa-bullseye",
                color: "from-red-500 to-pink-600",
                isPublic: false,
                maxMembers: 5,
                earnings: 78000,
                wins: 21,
                createdBy: "bibek_gurung",
                members: [
                    { name: "Bibek Gurung", role: "Captain", isCurrentUser: false },
                    { name: "Kiran Shah", role: "Member", isCurrentUser: false },
                    { name: "Rita Shrestha", role: "Member", isCurrentUser: false },
                    { name: "Hari Bahadur", role: "Member", isCurrentUser: false },
                    { name: "Sita Karki", role: "Member", isCurrentUser: false }
                ]
            },
            {
                id: 4,
                name: "Lalitpur Legends",
                tagline: "Legends never die",
                game: "cod",
                gameName: "COD Mobile",
                icon: "fa-gun",
                color: "from-green-500 to-emerald-700",
                isPublic: true,
                maxMembers: 4,
                earnings: 18500,
                wins: 6,
                createdBy: "anish_rai",
                members: [
                    { name: "Anish Rai", role: "Captain", isCurrentUser: false },
                    { name: "Nabin Magar", role: "Member", isCurrentUser: false },
                    { name: "Deepak Lama", role: "Member", isCurrentUser: false }
                ]
            }
        ];

        // Load custom-created teams from localStorage
        function loadAllTeams() {
            const custom = JSON.parse(localStorage.getItem('customTeams') || '[]');
            return [...allTeams, ...custom];
        }

        // 2. View switching
        let currentView = 'my';

        function showView(view, btn) {
            currentView = view;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTeams();
        }

        // 3. Render Teams
        function renderTeams() {
            const grid = document.getElementById('teams-grid');
            const emptyState = document.getElementById('empty-my-teams');
            const teams = loadAllTeams();
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));

            console.log("Rendering", currentView, "view with", teams.length, "total teams");

            // Filter teams based on view
            let displayTeams = teams;
            if (currentView === 'my') {
                if (!currentUser) {
                    displayTeams = [];
                } else {
                    displayTeams = teams.filter(t => t.createdBy === currentUser.username);
                }
            } else {
                // Browse view - show only public teams
                displayTeams = teams.filter(t => t.isPublic);
            }

            grid.innerHTML = '';

            if (displayTeams.length === 0) {
                emptyState.classList.remove('hidden');
                grid.classList.add('hidden');
                if (currentView === 'browse') {
                    emptyState.innerHTML = `
                        <i class="fa-solid fa-globe text-6xl text-gray-600 mb-4"></i>
                        <h2 class="text-xl font-bold text-white mb-2">No public teams available</h2>
                        <p class="text-gray-400 mb-6">Check back later or create your own team!</p>
                    `;
                    emptyState.classList.remove('hidden');
                }
                return;
            }

            emptyState.classList.add('hidden');
            grid.classList.remove('hidden');

            displayTeams.forEach(team => {
                const fillPercent = (team.members.length / team.maxMembers) * 100;
                const isFull = team.members.length >= team.maxMembers;
                const isOwner = currentUser && team.createdBy === currentUser.username;

                const card = document.createElement('div');
                card.className = "team-card glass-panel rounded-xl overflow-hidden shadow-lg flex flex-col";

                card.innerHTML = `
                    <div class="bg-gradient-to-br ${team.color} p-5 relative">
                        <div class="flex justify-between items-start">
                            <div class="bg-black/40 rounded-full px-3 py-1 text-xs font-bold text-white flex items-center gap-1">
                                <i class="fa-solid ${team.icon}"></i> ${team.gameName}
                            </div>
                            ${team.isPublic ? 
                                '<div class="bg-green-500/30 rounded-full px-3 py-1 text-xs font-bold text-green-300 border border-green-500">Public</div>' :
                                '<div class="bg-gray-500/30 rounded-full px-3 py-1 text-xs font-bold text-gray-300 border border-gray-500">Private</div>'}
                        </div>
                        <div class="flex items-center gap-3 mt-5">
                            <div class="w-14 h-14 rounded-lg bg-white/20 backdrop-blur-sm flex items-center justify-center border-2 border-white/30">
                                <span class="text-2xl font-bold text-white">${team.name.charAt(0)}</span>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-white drop-shadow">${team.name}</h3>
                                <p class="text-xs text-white/80 italic">"${team.tagline}"</p>
                            </div>
                        </div>
                    </div>

                    <div class="p-5 flex-grow">
                        <div class="grid grid-cols-2 gap-3 mb-4 text-sm">
                            <div class="bg-gray-800/50 rounded-lg p-3">
                                <p class="text-xs text-gray-400 mb-1">Total Earnings</p>
                                <p class="text-green-400 font-bold">Rs. ${team.earnings.toLocaleString()}</p>
                            </div>
                            <div class="bg-gray-800/50 rounded-lg p-3">
                                <p class="text-xs text-gray-400 mb-1">Wins</p>
                                <p class="text-yellow-400 font-bold">${team.wins}</p>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="flex justify-between text-xs text-gray-400 mb-1">
                                <span>Members</span>
                                <span>${team.members.length}/${team.maxMembers}</span>
                            </div>
                            <div class="w-full bg-gray-700 rounded-full h-2 overflow-hidden">
                                <div class="bg-gradient-to-r from-blue-500 to-purple-500 h-2 rounded-full" style="width: ${fillPercent}%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="p-5 pt-0 flex gap-2">
                        <button onclick="viewTeamDetails(${team.id})" class="flex-grow glass-panel hover:bg-gray-800/50 text-white font-bold py-2 rounded-lg transition text-sm">
                            <i class="fa-solid fa-eye mr-1"></i> View
                        </button>
                        ${isOwner ? 
                            '<button onclick="manageTeam(' + team.id + ')" class="flex-grow bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg transition text-sm"><i class="fa-solid fa-gear mr-1"></i> Manage</button>' :
                            (isFull ?
                                '<button disabled class="flex-grow bg-gray-600 text-white font-bold py-2 rounded-lg text-sm cursor-not-allowed"><i class="fa-solid fa-lock mr-1"></i> Full</button>' :
                                '<button onclick="joinTeam(' + team.id + ')" class="flex-grow bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-lg transition text-sm"><i class="fa-solid fa-plus mr-1"></i> Join</button>'
                            )}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 4. Create Team Modal
        function openCreateModal() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user) {
                alert("You need to login first to create a team.");
                window.location.href = 'member.html';
                return;
            }
            document.getElementById('createModal').classList.remove('hidden');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.add('hidden');
            document.getElementById('createTeamForm').reset();
        }

        function createTeam(event) {
            event.preventDefault();
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            
            const name = document.getElementById('teamName').value.trim();
            const tagline = document.getElementById('teamTagline').value.trim() || "Ready to battle!";
            const game = document.getElementById('teamGame').value;
            const max = parseInt(document.getElementById('teamMax').value);
            const isPublic = document.getElementById('teamPublic').checked;

            if (!name || !game) {
                alert("Please fill in all required fields.");
                return;
            }

            const gameMap = {
                freefire: { name: "Free Fire", icon: "fa-fire", color: "from-orange-500 to-red-600" },
                pubg: { name: "PUBG Mobile", icon: "fa-crosshairs", color: "from-yellow-500 to-orange-600" },
                valorant: { name: "Valorant", icon: "fa-bullseye", color: "from-red-500 to-pink-600" },
                cod: { name: "COD Mobile", icon: "fa-gun", color: "from-green-500 to-emerald-700" }
            };

            const newTeam = {
                id: Date.now(),
                name: name,
                tagline: tagline,
                game: game,
                gameName: gameMap[game].name,
                icon: gameMap[game].icon,
                color: gameMap[game].color,
                isPublic: isPublic,
                maxMembers: max,
                earnings: 0,
                wins: 0,
                createdBy: currentUser.username,
                members: [
                    { name: currentUser.username, role: "Captain", isCurrentUser: true }
                ]
            };

            const existing = JSON.parse(localStorage.getItem('customTeams') || '[]');
            existing.push(newTeam);
            localStorage.setItem('customTeams', JSON.stringify(existing));

            console.log("Team created:", newTeam);

            closeCreateModal();
            alert(`✅ Team "${name}" created successfully!\n\nYou are now the captain.`);
            
            // Switch to "My Teams" view
            document.getElementById('tabMyTeams').click();
        }

        // 5. View Team Details
        function viewTeamDetails(teamId) {
            const teams = loadAllTeams();
            const team = teams.find(t => t.id === teamId);
            if (!team) return;

            document.getElementById('detailsTitle').innerHTML = `<i class="fa-solid ${team.icon} mr-2"></i>${team.name}`;
            
            const membersHtml = team.members.map(m => `
                <div class="flex items-center gap-3 p-3 bg-gray-800/50 rounded-lg mb-2">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white font-bold">
                        ${m.name.charAt(0).toUpperCase()}
                    </div>
                    <div class="flex-grow">
                        <p class="font-bold text-white text-sm">${m.name}</p>
                        <span class="text-xs px-2 py-0.5 rounded-full ${m.role === 'Captain' ? 'role-captain' : 'role-member'}">
                            ${m.role === 'Captain' ? '<i class="fa-solid fa-crown mr-1"></i>' : ''}${m.role}
                        </span>
                    </div>
                </div>
            `).join('');

            document.getElementById('detailsContent').innerHTML = `
                <div class="bg-gradient-to-br ${team.color} rounded-lg p-4 mb-4 text-center">
                    <div class="w-20 h-20 mx-auto rounded-lg bg-white/20 backdrop-blur-sm flex items-center justify-center border-2 border-white/30 mb-2">
                        <span class="text-3xl font-bold text-white">${team.name.charAt(0)}</span>
                    </div>
                    <p class="text-white/80 text-sm italic">"${team.tagline}"</p>
                </div>

                <div class="grid grid-cols-3 gap-3 mb-4 text-center">
                    <div class="bg-gray-800/50 rounded-lg p-3">
                        <p class="text-xs text-gray-400">Earnings</p>
                        <p class="text-green-400 font-bold text-sm">Rs. ${team.earnings.toLocaleString()}</p>
                    </div>
                    <div class="bg-gray-800/50 rounded-lg p-3">
                        <p class="text-xs text-gray-400">Wins</p>
                        <p class="text-yellow-400 font-bold text-sm">${team.wins}</p>
                    </div>
                    <div class="bg-gray-800/50 rounded-lg p-3">
                        <p class="text-xs text-gray-400">Members</p>
                        <p class="text-blue-400 font-bold text-sm">${team.members.length}/${team.maxMembers}</p>
                    </div>
                </div>

                <h3 class="font-bold text-white mb-3"><i class="fa-solid fa-users mr-2"></i>Team Members</h3>
                ${membersHtml}

                <div class="mt-4 flex gap-2">
                    <button onclick="closeDetailsModal()" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-lg transition text-sm">Close</button>
                </div>
            `;

            document.getElementById('detailsModal').classList.remove('hidden');
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.add('hidden');
        }

        // 6. Join Team
        function joinTeam(teamId) {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                alert("Please login first to join a team.");
                window.location.href = 'member.html';
                return;
            }
            const teams = loadAllTeams();
            const team = teams.find(t => t.id === teamId);
            if (team) {
                alert(`✅ Join request sent to "${team.name}"!\n\nThe captain will review your request.`);
            }
        }

        // 7. Manage Team (owner only)
        function manageTeam(teamId) {
            alert("Team management panel coming soon! You'll be able to invite, kick, and edit your team.");
        }

        // 8. Modal backdrop click to close
        document.getElementById('createModal').addEventListener('click', function(e) {
            if (e.target === this) closeCreateModal();
        });
        document.getElementById('detailsModal').addEventListener('click', function(e) {
            if (e.target === this) closeDetailsModal();
        });

        // Initialize
        window.onload = function() {
            renderTeams();
        };
    </script>
</body>
</html>
