<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NEPPLAY - Member Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#1b1b1b;
    border:1px solid #333;
    border-radius:12px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    color:#ff3b30;
    font-size:32px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:28px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#ddd;
    font-size:14px;
}

input{
    width:100%;
    padding:13px;
    margin-bottom:18px;
    border-radius:7px;
    border:1px solid #444;
    background:#111;
    color:#fff;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#ff3b30;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:7px;
    background:#ff3b30;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:7px;
    text-align:center;
    font-size:14px;
    line-height:1.5;
}

.error{
    background:#3b1717;
    color:#ff7777;
}

.success{
    background:#173b20;
    color:#72e08a;
}

.info{
    background:#1a2d45;
    color:#84c1ff;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a,
.forgot-link{
    color:#ff3b30;
    text-decoration:none;
    cursor:pointer;
    font-size:14px;
}

.links a:hover,
.forgot-link:hover{
    text-decoration:underline;
}

.forgot-wrap{
    text-align:right;
    margin-top:8px;
    margin-bottom:14px;
}

.reset-header{
    text-align:center;
    margin-bottom:20px;
}

.reset-header h2{
    font-size:20px;
    margin-bottom:6px;
    color:#fff;
}

.reset-header p{
    color:#aaa;
    font-size:13px;
    line-height:1.5;
}

.back-row{
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
}

.btn-secondary{
    background:transparent !important;
    border:1px solid #444 !important;
    color:#ddd !important;
    font-weight:normal !important;
    width:auto !important;
    padding:13px 20px !important;
    flex-shrink:0;
}

.btn-secondary:hover{
    border-color:#ff3b30 !important;
    color:#fff !important;
}

#resetFormWrap{
    display:none;
}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        NEPPLAY
    </div>

    <div class="subtitle">
        Member Login
    </div>

    <!-- ─── LOGIN FORM ─────────────────────────── -->
    <div id="loginFormWrap">

        <form id="loginForm">

            <label for="login">
                Username or Email
            </label>

            <input
                type="text"
                id="login"
                name="login"
                autocomplete="username"
                placeholder="Enter username or email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="Enter password"
                required
            >

            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>

        </form>

        <div class="forgot-wrap">
            <span
                class="forgot-link"
                onclick="showResetForm()"
            >
                Forgot password?
            </span>
        </div>

    </div>

    <!-- ─── RESET PASSWORD FORM ────────────────── -->
    <div id="resetFormWrap">

        <div class="reset-header">
            <h2>Reset Password</h2>
            <p>Enter your account email and we'll send you a password reset link.</p>
        </div>

        <form id="resetForm">

            <label for="resetEmail">
                Account Email
            </label>

            <input
                type="email"
                id="resetEmail"
                name="resetEmail"
                autocomplete="email"
                placeholder="you@example.com"
                required
            >

            <div class="back-row">
                <button
                    type="button"
                    class="btn-secondary"
                    onclick="showLoginForm()"
                >
                    ← Back
                </button>
                <button
                    type="submit"
                    id="resetButton"
                    style="flex:1;"
                >
                    Send Reset Link
                </button>
            </div>

        </form>

    </div>

    <!-- ─── MESSAGE ────────────────────────────── -->
    <div
        id="message"
        class="message"
    ></div>

    <div class="links" id="bottomLinks">

        <a href="register.html">
            Create Account
        </a>

    </div>

</div>


<!-- ─── SCRIPT: existing login flow ─────────────── -->
<script type="module">

import { initializeApp, getApps }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    fetchSignInMethodsForEmail
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
    getFirestore, collection, query, where, getDocs, limit
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const cfg = {
    apiKey: "AIzaSyDydTDF5_DOC3BDH6YAbkcNu_NT0qmRcTc",
    authDomain: "nepplaygaming.firebaseapp.com",
    projectId: "nepplaygaming",
    storageBucket: "nepplaygaming.firebasestorage.app",
    messagingSenderId: "893565645520",
    appId: "1:893565645520:web:09d4cb4069dae55d6ee4d5"
};

const app  = getApps().length ? getApps()[0] : initializeApp(cfg);
const auth = getAuth(app);
const db   = getFirestore(app);

const form    = document.getElementById("loginForm");
const button  = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
    message.style.display = "block";
}

form.addEventListener("submit", async function (event) {
    event.preventDefault();
    button.disabled = true;
    button.textContent = "Logging in...";
    message.style.display = "none";

    const loginInput = document.getElementById("login").value.trim();
    const password   = document.getElementById("password").value;

    if (!loginInput || !password) {
        showMessage("Please enter username/email and password.", "error");
        button.disabled = false;
        button.textContent = "Login";
        return;
    }

    try {
        let email = loginInput;

        // If user typed a username (not email), look up their email from Firestore
        if (!loginInput.includes("@")) {
            const snap = await getDocs(query(
                collection(db, "users"),
                where("username", "==", loginInput),
                limit(1)
            ));
            if (snap.empty) {
                throw new Error("No account found with that username.");
            }
            email = snap.docs[0].data().email;
            if (!email) {
                throw new Error("This account has no email set. Please contact admin.");
            }
        }

        await signInWithEmailAndPassword(auth, email, password);

        showMessage("Login successful. Opening...", "success");

        setTimeout(function () {
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get("redirect");
            if (redirect) {
                window.location.href = decodeURIComponent(redirect);
            } else {
                window.location.href = "member.html";
            }
        }, 700);

    } catch (error) {
        console.error("NEPPLAY LOGIN ERROR:", error);

        let friendly = "Login failed. Please try again.";

        if (error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found") {
            friendly = "❌ Wrong email/username or password. Please check and try again.";
        } else if (error.code === "auth/invalid-email") {
            friendly = "❌ Invalid email address.";
        } else if (error.code === "auth/too-many-requests") {
            friendly = "❌ Too many failed attempts. Please wait 15 minutes and try again.";
        } else if (error.code === "auth/user-disabled") {
            friendly = "❌ This account has been disabled. Contact admin.";
        } else if (error.message) {
            friendly = error.message;
        }

        showMessage(friendly, "error");
        button.disabled = false;
        button.textContent = "Login";
    }
});

// ============ Forgot password ============
window.showResetForm = function () {
    document.getElementById('loginFormWrap').style.display = 'none';
    document.getElementById('resetFormWrap').style.display = 'block';
    document.getElementById('message').style.display = 'none';
    setTimeout(() => document.getElementById('resetEmail')?.focus(), 50);
};

window.showLoginForm = function () {
    document.getElementById('resetFormWrap').style.display = 'none';
    document.getElementById('loginFormWrap').style.display = 'block';
    document.getElementById('message').style.display = 'none';
    document.getElementById('resetEmail').value = '';
};

const resetForm = document.getElementById('resetForm');
const resetBtn  = document.getElementById('resetButton');

resetForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    const email = document.getElementById('resetEmail').value.trim();
    if (!email || !email.includes("@")) {
        showMessage('Please enter a valid email.', 'error');
        return;
    }

    resetBtn.disabled = true;
    resetBtn.textContent = 'Sending…';

    try {
        await sendPasswordResetEmail(auth, email);
        showMessage('✅ Reset link sent to ' + email + '. Check your inbox (and spam).', 'success');
        setTimeout(() => {
            window.showLoginForm();
            resetBtn.disabled = false;
            resetBtn.textContent = 'Send Reset Link';
        }, 4000);
    } catch (err) {
        console.error('Reset error:', err);
        let friendly = 'Could not send reset email. Please try again.';
        if (err.code === 'auth/invalid-email') friendly = 'Invalid email.';
        else if (err.code === 'auth/user-not-found') friendly = 'If that email is registered, a reset link has been sent.';
        else if (err.code === 'auth/too-many-requests') friendly = 'Too many requests. Wait a few minutes.';
        showMessage('❌ ' + friendly, 'error');
        resetBtn.disabled = false;
        resetBtn.textContent = 'Send Reset Link';
    }
});

</script>


<!-- ─── SCRIPT: forgot password (Firebase) ──────── -->
<script type="module">

import { initializeApp, getApps }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import { getAuth, sendPasswordResetEmail }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const cfg = {
    apiKey: "AIzaSyDydTDF5_DOC3BDH6YAbkcNu_NT0qmRcTc",
    authDomain: "nepplaygaming.firebaseapp.com",
    projectId: "nepplaygaming",
    storageBucket: "nepplaygaming.firebasestorage.app",
    messagingSenderId: "893565645520",
    appId: "1:893565645520:web:09d4cb4069dae55d6ee4d5"
};

const app  = getApps().length ? getApps()[0] : initializeApp(cfg);
const auth = getAuth(app);

// Make these available globally for the onclick handlers
window.showResetForm = function () {
    document.getElementById('loginFormWrap').style.display = 'none';
    document.getElementById('resetFormWrap').style.display = 'block';
    // Clear any old message
    const m = document.getElementById('message');
    m.style.display = 'none';
    // Focus the email input
    setTimeout(() => {
        document.getElementById('resetEmail')?.focus();
    }, 50);
};

window.showLoginForm = function () {
    document.getElementById('resetFormWrap').style.display = 'none';
    document.getElementById('loginFormWrap').style.display = 'block';
    const m = document.getElementById('message');
    m.style.display = 'none';
    // Clear reset email field
    document.getElementById('resetEmail').value = '';
};

const resetForm = document.getElementById('resetForm');
const resetBtn  = document.getElementById('resetButton');

resetForm.addEventListener('submit', async function (e) {
    e.preventDefault();

    const email = document.getElementById('resetEmail').value.trim();

    if (!email) {
        showMessage('Please enter your account email.', 'error');
        return;
    }

    if (!email.includes('@') || !email.includes('.')) {
        showMessage('Please enter a valid email address.', 'error');
        return;
    }

    resetBtn.disabled = true;
    resetBtn.textContent = 'Sending…';

    try {
        await sendPasswordResetEmail(auth, email);

        showMessage(
            '✅ Reset link sent to ' + email + '. Check your inbox (and spam folder).',
            'success'
        );

        // Auto-return to login after 4 seconds
        setTimeout(() => {
            window.showLoginForm();
            resetBtn.disabled = false;
            resetBtn.textContent = 'Send Reset Link';
            // Keep the success message visible
            showMessage(
                '✅ Check your email for the reset link. Then log in here.',
                'success'
            );
        }, 4000);

    } catch (err) {
        console.error('Password reset error:', err);

        let friendly = 'Could not send reset email. Please try again.';
        if (err.code === 'auth/invalid-email') {
            friendly = 'That email address looks invalid.';
        } else if (err.code === 'auth/user-not-found') {
            // Firebase intentionally returns success for security,
            // but some versions throw. Handle gracefully.
            friendly = 'If that email is registered, a reset link has been sent.';
        } else if (err.code === 'auth/too-many-requests') {
            friendly = 'Too many requests. Please wait a few minutes and try again.';
        }

        showMessage('❌ ' + friendly, 'error');
        resetBtn.disabled = false;
        resetBtn.textContent = 'Send Reset Link';
    }
});

</script>

</body>

</html>
