<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEPPLAY — Tournament Registration</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
html, body { overflow-x: hidden; max-width: 100vw; }
body{ font-family:Arial,Helvetica,sans-serif; background:#080d18; color:#fff; min-height:100vh; }
.topnav{ display:flex; align-items:center; justify-content:space-between; padding:14px 22px; background:rgba(15,8,35,.85); backdrop-filter:blur(14px); border-bottom:1px solid rgba(168,85,247,.25); position:sticky; top:0; z-index:50; gap:10px; max-width:100%; }
.brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.1rem; color:#fff; text-decoration:none; flex-shrink:0; }
.brand .logo{ width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#7c3aed,#a855f7); display:grid; place-items:center; font-size:1rem; }
.nav-links{ display:flex; gap:14px; font-size:.9rem; align-items:center; overflow-x:auto; scrollbar-width:none; flex:1; justify-content:flex-end; }
.nav-links::-webkit-scrollbar { display: none; }
.nav-links > a{ color:#a8a3c9; text-decoration:none; transition:color .2s; display:inline-flex; align-items:center; white-space:nowrap; flex-shrink:0; }
.nav-links > a:hover{ color:#fff; }
.nav-links > a.active{ color:#fbbf24; }
.nav-links > a.winners-link{ background:linear-gradient(135deg,#f59e0b,#fbbf24); color:#1a0b3d !important; padding:6px 12px; border-radius:999px; font-weight:800; font-size:.82rem; }
.nav-links > a.store-link{ background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff !important; padding:6px 12px; border-radius:999px; font-weight:800; font-size:.82rem; }
.container{ width:min(850px,94%); margin:30px auto; }
.card{ background:#111927; border:1px solid #27364d; border-radius:15px; padding:25px; margin-bottom:20px; }
.title{ font-size:25px; margin-bottom:8px; }
.subtitle{ color:#8da2bc; line-height:1.6; margin-bottom:20px; }
.tournament-box{ background:#0b1320; border:1px solid #2b3d56; border-radius:10px; padding:18px; margin-bottom:22px; }
.tournament-name{ font-size:21px; font-weight:bold; color:#ff3b30; }
.game{ margin-top:6px; color:#9cb5d3; }
.fee{ margin-top:10px; font-size:20px; font-weight:bold; }
.mode-badge{ display:inline-block; padding:4px 12px; border-radius:999px; font-size:.7rem; font-weight:800; letter-spacing:.5px; text-transform:uppercase; margin-left:10px; vertical-align:middle; }
.mode-badge.solo  { background:rgba(34,197,94,.2);  color:#4ade80; border:1px solid rgba(34,197,94,.5); }
.mode-badge.duo   { background:rgba(59,130,246,.2); color:#7db7ff; border:1px solid rgba(59,130,246,.5); }
.mode-badge.squad { background:rgba(245,158,11,.2); color:#fbbf24; border:1px solid rgba(245,158,11,.5); }
.mode-locked-banner { background: linear-gradient(135deg, rgba(124,58,237,.15), rgba(168,85,247,.1)); border: 1px solid rgba(168,85,247,.4); border-radius: 12px; padding: 14px 18px; margin-bottom: 22px; display: flex; align-items: center; gap: 14px; }
.mode-locked-banner .mlb-icon { font-size: 2rem; flex-shrink: 0; line-height: 1; }
.mode-locked-banner .mlb-text { flex: 1; }
.mode-locked-banner .mlb-title { font-weight: 800; font-size: .95rem; color: #fff; margin-bottom: 2px; }
.mode-locked-banner .mlb-sub { font-size: .78rem; color: #a8a3c9; line-height: 1.4; }
.form-group{ margin-bottom:17px; }
label{ display:block; margin-bottom:7px; color:#c8d5e5; font-weight:bold; }
input, textarea, select{ width:100%; padding:12px; border-radius:8px; border:1px solid #30435e; background:#0a111d; color:#fff; font-size:15px; outline:none; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:15px; }
.section-title{ font-size:19px; margin:25px 0 15px; color:#fff; }
.amount{ background:#153b2b; border:1px solid #267a55; color:#8ef0bb; border-radius:10px; padding:15px; margin-bottom:15px; font-size:18px; font-weight:bold; }
.submit{ width:100%; background:#ff3b30; color:white; border:0; border-radius:9px; padding:15px; font-size:17px; font-weight:bold; cursor:pointer; margin-top:10px; }
.message{ padding:15px; border-radius:9px; margin-bottom:18px; display:none; }
.message.error{ display:block; background:#411818; border:1px solid #9e3030; color:#ffbaba; }
.loading-state{ padding:40px 20px; text-align:center; color:#8da2bc; font-size:15px; }
</style>
</head>
<body>
<nav class="topnav">
  <a href="/member.html" class="brand"><span class="logo">🎮</span><span class="brand-text">Nepal Gaming</span></a>
  <div class="nav-links">
    <a href="/member.html">Home</a>
    <a href="/tournaments.html" class="active">Tournaments</a>
    <a href="/winners.html" class="winners-link">🏆 Winners</a>
    <a href="/store.html" class="store-link">🛒 Store</a>
  </div>
</nav>

<div class="container">
    <div class="card">
        <h1 class="title">Tournament Registration</h1>
        <p class="subtitle">Complete your information. Your registration will remain <b>Pending</b> until the admin verifies your entry.</p>
        <div id="message" class="message"></div>
        <div id="loading" class="loading-state">⏳ Loading tournament…</div>
        <div id="tournamentBox" class="tournament-box" style="display:none;">
            <div><span id="tournamentName" class="tournament-name">—</span><span id="modeBadge" class="mode-badge"></span></div>
            <div id="gameName" class="game"></div>
            <div id="entryFee" class="fee"></div>
        </div>
        <form id="registrationForm" style="display:none;">
            <div class="form-group"><label>Team Name *</label><input id="teamName" placeholder="e.g. Nepali Warriors"></div>
            <div class="form-group"><label>Captain IGN *</label><input id="captainName"></div>
            <div class="amount" id="amountBox">Amount: Loading…</div>
            <div class="form-group"><label>Transaction ID *</label><input id="transactionId" placeholder="Enter transaction ID"></div>
            <button type="submit" id="submitButton" class="submit">Submit Registration</button>
        </form>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
// ⭐ Notice the added getDocFromServer import
import { getFirestore, doc, getDocFromServer, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDydTDF5_DOC3BDH6YAbkcNu_NT0qmRcTc",
    authDomain: "nepplaygaming.firebaseapp.com",
    projectId: "nepplaygaming",
    storageBucket: "nepplaygaming.firebasestorage.app",
    messagingSenderId: "893565645520",
    appId: "1:893565645520:web:09d4cb4069dae55d6ee4d5"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);
let currentUser = null;
let tournament = null;

function showMessage(text, type) {
    const box = $("message");
    box.textContent = text;
    box.className = "message " + type;
}

onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "/login.html"; return; }
    currentUser = user;

    const params = new URLSearchParams(window.location.search);
    // ⭐ CRITICAL FIX: Added .trim() to remove any invisible spaces from the URL
    const tidParam = (params.get("tournamentId") || params.get("tournament") || "").trim();
    
    console.log("Looking for Tournament ID:", tidParam);

    if (!tidParam) {
        showMessage("❌ No tournament ID found in the link. Please go back and try again.", "error");
        $("loading").style.display = "none";
        return;
    }

    try {
        // ⭐ CRITICAL FIX: Fetch directly from the Firebase Server to bypass browser cache
        const tDoc = await getDocFromServer(doc(db, "tournaments", tidParam));
        
        if (!tDoc.exists()) {
            showMessage("❌ Tournament not found. Please verify the ID in Firebase.", "error");
            $("loading").style.display = "none";
            return;
        }

        tournament = { id: tDoc.id, ...tDoc.data() };
        
        $("tournamentName").textContent = tournament.title || "Tournament";
        $("gameName").textContent = tournament.game || "";
        $("entryFee").textContent = "Entry Fee: Rs " + (tournament.entryFee || 0);
        $("amountBox").textContent = "Amount to Pay: Rs " + (tournament.entryFee || 0);
        $("modeBadge").textContent = "Mode: " + (tournament.mode || "Squad");
        
        $("loading").style.display = "none";
        $("tournamentBox").style.display = "block";
        $("registrationForm").style.display = "block";

    } catch (e) {
        console.error("Firebase Error:", e);
        // ⭐ If Firebase throws a permissions error, we will show it here instead of "not found"
        showMessage("❌ Error: " + e.message, "error");
        $("loading").style.display = "none";
    }
});
</script>
</body>
</html>
