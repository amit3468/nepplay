<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEPPLAY — FFWS 2026 Predictions</title>
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --purple: #7c3aed;
    --purple-2: #a855f7;
    --pink: #ec4899;
    --gold: #fbbf24;
    --text: #f5f3ff;
    --muted: #a8a3c9;
    --bg: #05030f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image: 
      radial-gradient(circle at 20% 0%, rgba(236,72,153,0.15) 0%, transparent 45%),
      radial-gradient(circle at 80% 100%, rgba(124,58,237,0.25) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, #1a0b3d 0%, #0a0618 55%, #05030f 100%);
    padding-bottom: 60px;
  }

  /* TOPNAV */
  .topnav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px;
    background: rgba(15, 8, 35, 0.85);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(168, 85, 247, 0.25);
    position: sticky; top: 0; z-index: 50;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; color: #fff; text-decoration: none; }
  .brand .logo { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--purple), var(--purple-2)); display: grid; place-items: center; font-size: 1rem; }
  .nav-links { display: flex; gap: 14px; font-size: 0.9rem; align-items: center; justify-content: flex-end; }
  .nav-links > a { color: var(--muted); text-decoration: none; font-weight: 600; }
  .nav-links > a:hover { color: #fff; }
  .nav-links > a.winners-link { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #1a0b3d !important; padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 0.82rem; }
  .nav-links > a.store-link { background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff !important; padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 0.82rem; }
  .nav-links > a.predictions-link { background: linear-gradient(135deg, #ec4899, #8b5cf6); color: #fff !important; padding: 6px 14px; border-radius: 999px; font-weight: 900 !important; font-size: 0.82rem !important; box-shadow: 0 0 15px rgba(236, 72, 153, 0.6); animation: pulsePrediction 2s infinite; text-transform: uppercase; }
  @keyframes pulsePrediction { 0% { box-shadow: 0 0 10px rgba(236, 72, 153, 0.5); transform: scale(1); } 50% { box-shadow: 0 0 22px rgba(236, 72, 153, 0.9); transform: scale(1.05); } 100% { box-shadow: 0 0 10px rgba(236, 72, 153, 0.5); transform: scale(1); } }

  /* MAIN CONTENT */
  .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
  
  .header-banner {
    text-align: center;
    margin-bottom: 30px;
  }
  .header-banner h1 {
    color: #fff;
    font-size: 2rem;
    font-weight: 900;
    text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
    margin-bottom: 8px;
  }
  .header-banner p {
    color: var(--gold);
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 1px;
  }

  /* PREDICTION CARD */
  .day-card {
    background: rgba(30, 18, 60, 0.85);
    border: 1px solid rgba(168, 85, 247, 0.4);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .day-title {
    color: var(--gold);
    font-size: 1.3rem;
    font-weight: 900;
    border-bottom: 1px solid rgba(251,191,36,0.3);
    padding-bottom: 10px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
  }
  
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-group label {
    font-size: 0.8rem;
    color: #a8a3c9;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .input-group input {
    background: rgba(15, 8, 35, 0.7);
    border: 1px solid rgba(168, 85, 247, 0.3);
    padding: 14px;
    border-radius: 10px;
    color: #fff;
    font-size: 0.95rem;
    outline: none;
    font-family: inherit;
    transition: border 0.2s;
  }
  .input-group input:focus { border-color: var(--purple-2); box-shadow: 0 0 10px rgba(168, 85, 247, 0.3); }

  .submit-btn {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, #ec4899, #8b5cf6);
    color: #fff;
    border: none;
    padding: 18px;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 900;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 10px 25px rgba(236, 72, 153, 0.5);
    transition: transform 0.2s;
    margin-top: 10px;
  }
  .submit-btn:hover { transform: translateY(-2px); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .status-msg { text-align: center; margin-top: 20px; font-weight: 800; color: #4ade80; font-size: 1.05rem; }
</style>
</head>
<body>

<nav class="topnav">
  <a href="/member.html" class="brand">
    <span class="logo">🎮</span>
    <span class="brand-text">NEPPLAY</span>
  </a>
  <div class="nav-links">
    <a href="/member.html">Home</a>
    <a href="/tournaments.html">Tournaments</a>
    <a href="/winners.html" class="winners-link">🏆 Winners</a>
    <a href="/store.html" class="store-link">🛒 Store</a>
    <a href="/predictions.html" class="predictions-link">🔮 Predictions</a>
    <a href="/support.html">Support</a>
  </div>
</nav>

<div class="container">
  
  <div class="header-banner">
    <h1>🏆 FFWS 2026 – PREDICTION BOARD 🇳🇵</h1>
    <p>🔥 PREDICT THE WINNERS & WIN A SMARTPHONE! 🔥</p>
  </div>

  <!-- FORM CONTAINER -->
  <form id="ffwsPredictionForm">
    
    <!-- DAY 1 -->
    <div class="day-card">
      <div class="day-title">📅 DAY 1</div>
      <div class="form-grid">
        <div class="input-group">
          <label>Top 2 Teams (Direct Final Qual)</label>
          <input type="text" id="day1_top_teams" placeholder="e.g. Team A, Team B" required>
        </div>
        <div class="input-group">
          <label>Team Names (Winner)</label>
          <input type="text" id="day1_winner" placeholder="Winning Team Name" required>
        </div>
        <div class="input-group">
          <label>Kill Points (Max)</label>
          <input type="number" id="day1_kills" placeholder="e.g. 25" required>
        </div>
        <div class="input-group">
          <label>Placement Points (Max)</label>
          <input type="number" id="day1_placement" placeholder="e.g. 18" required>
        </div>
        <div class="input-group">
          <label>Booyah Count</label>
          <input type="number" id="day1_booyah" placeholder="e.g. 3" required>
        </div>
      </div>
    </div>

    <!-- DAY 2 -->
    <div class="day-card">
      <div class="day-title">📅 DAY 2</div>
      <div class="form-grid">
        <div class="input-group">
          <label>Top 2 Teams (Direct Final Qual)</label>
          <input type="text" id="day2_top_teams" placeholder="e.g. Team C, Team D" required>
        </div>
        <div class="input-group">
          <label>Team Names (Winner)</label>
          <input type="text" id="day2_winner" placeholder="Winning Team Name" required>
        </div>
        <div class="input-group">
          <label>Kill Points (Max)</label>
          <input type="number" id="day2_kills" placeholder="e.g. 30" required>
        </div>
        <div class="input-group">
          <label>Placement Points (Max)</label>
          <input type="number" id="day2_placement" placeholder="e.g. 20" required>
        </div>
        <div class="input-group">
          <label>Booyah Count</label>
          <input type="number" id="day2_booyah" placeholder="e.g. 4" required>
        </div>
      </div>
    </div>

    <!-- DAY 3 -->
    <div class="day-card">
      <div class="day-title">📅 DAY 3</div>
      <div class="form-grid">
        <div class="input-group">
          <label>Top 2 Teams (Direct Final Qual)</label>
          <input type="text" id="day3_top_teams" placeholder="e.g. Team E, Team F" required>
        </div>
        <div class="input-group">
          <label>Team Names (Winner)</label>
          <input type="text" id="day3_winner" placeholder="Winning Team Name" required>
        </div>
        <div class="input-group">
          <label>Kill Points (Max)</label>
          <input type="number" id="day3_kills" placeholder="e.g. 28" required>
        </div>
        <div class="input-group">
          <label>Placement Points (Max)</label>
          <input type="number" id="day3_placement" placeholder="e.g. 15" required>
        </div>
        <div class="input-group">
          <label>Booyah Count</label>
          <input type="number" id="day3_booyah" placeholder="e.g. 2" required>
        </div>
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Submit All Predictions</button>
    <div class="status-msg" id="statusMsg"></div>

  </form>

</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const cfg = {
    apiKey: "AIzaSyDydTDF5_DOC3BDH6YAbkcNu_NT0qmRcTc",
    authDomain: "nepplaygaming.firebaseapp.com",
    projectId: "nepplaygaming",
    storageBucket: "nepplaygaming.firebasestorage.app",
    messagingSenderId: "893565645520",
    appId: "1:893565645520:web:09d4cb4069dae55d6ee4d5"
};
const app = getApps().length ? getApps()[0] : initializeApp(cfg);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
const form = document.getElementById('ffwsPredictionForm');
const submitBtn = document.getElementById('submitBtn');
const statusMsg = document.getElementById('statusMsg');

onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    if (!user) {
        alert("Please log in to submit predictions!");
        window.location.href = "/login.html?redirect=" + encodeURIComponent("/predictions.html");
    } else {
        // Check if they already submitted
        try {
            const predRef = doc(db, 'ffws_predictions', user.uid);
            const predSnap = await getDoc(predRef);
            if (predSnap.exists()) {
                statusMsg.innerHTML = "✅ You have already submitted your predictions for FFWS 2026!";
                statusMsg.style.color = "#fbbf24";
                submitBtn.disabled = true;
                submitBtn.textContent = "Predictions Locked";
            }
        } catch(e) {}
    }
});

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!currentUser) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Saving...";
    statusMsg.innerHTML = "";

    const predictions = {
        userId: currentUser.uid,
        game: "FFWS 2026",
        submittedAt: serverTimestamp(),
        day1: {
            topTeams: document.getElementById('day1_top_teams').value,
            winner: document.getElementById('day1_winner').value,
            kills: document.getElementById('day1_kills').value,
            placement: document.getElementById('day1_placement').value,
            booyah: document.getElementById('day1_booyah').value
        },
        day2: {
            topTeams: document.getElementById('day2_top_teams').value,
            winner: document.getElementById('day2_winner').value,
            kills: document.getElementById('day2_kills').value,
            placement: document.getElementById('day2_placement').value,
            booyah: document.getElementById('day2_booyah').value
        },
        day3: {
            topTeams: document.getElementById('day3_top_teams').value,
            winner: document.getElementById('day3_winner').value,
            kills: document.getElementById('day3_kills').value,
            placement: document.getElementById('day3_placement').value,
            booyah: document.getElementById('day3_booyah').value
        }
    };

    try {
        // Save to Firebase using the User's UID as the document ID
        await setDoc(doc(db, "ffws_predictions", currentUser.uid), predictions);
        
        statusMsg.innerHTML = "🏆 Predictions Saved Successfully! Good luck!";
        statusMsg.style.color = "#4ade80";
        submitBtn.textContent = "Predictions Locked";
    } catch (error) {
        console.error("Error saving predictions:", error);
        statusMsg.innerHTML = "❌ Error saving predictions. Please try again.";
        statusMsg.style.color = "#fca5a5";
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit All Predictions";
    }
});
</script>

</body>
</html>
